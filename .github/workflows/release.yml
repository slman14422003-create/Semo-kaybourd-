name: Release

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "**.md", ".github/ISSUE_TEMPLATE/**", ".github/dependabot.yml" ]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        default: auto
        options: [ auto, patch, minor, major ]
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compute version and tag
        id: ver
        env:
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          GRADLE_VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "$GRADLE_VERSION" ] || { echo "versionName not found" >&2; exit 1; }

          LAST=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -z "$LAST" ]; then
            VERSION="$GRADLE_VERSION"
            RANGE="HEAD"
          else
            BASE="${LAST#v}"
            MAJOR=${BASE%%.*}; REST=${BASE#*.}; MINOR=${REST%%.*}; PATCH=${REST#*.}
            RANGE="${LAST}..HEAD"
            SUBJECTS=$(git log "$RANGE" --pretty=%B)
            BUMP="${BUMP_INPUT:-auto}"
            if [ "$BUMP" = "auto" ]; then
              if echo "$SUBJECTS" | grep -qiE 'BREAKING CHANGE|^[a-z]+(\(.+\))?!:'; then BUMP=major
              elif echo "$SUBJECTS" | grep -qiE '^(feat|add|new)'; then BUMP=minor
              else BUMP=patch; fi
            fi
            case "$BUMP" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              *) PATCH=$((PATCH+1)) ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            # a higher versionName written by hand in gradle wins over the computed one
            HIGHEST=$(printf '%s\n%s\n' "$VERSION" "$GRADLE_VERSION" | sort -V | tail -n 1)
            VERSION="$HIGHEST"
          fi

          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG="v${VERSION}-${GITHUB_RUN_NUMBER}"
          fi
          CODE=$(( GITHUB_RUN_NUMBER + 100 ))
          GRADLE_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          [ "$GRADLE_CODE" -ge "$CODE" ] && CODE=$((GRADLE_CODE + 1))

          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${CODE}/" app/build.gradle.kts

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "last=${LAST}" >> "$GITHUB_OUTPUT"
          echo "### Release ${TAG} (code ${CODE})" >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare assets
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          [ -n "$APK" ] || { echo "No release APK found" >&2; exit 1; }
          OUT="SemoKeyboard-${{ steps.ver.outputs.tag }}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"
          echo "file=${OUT}" >> "$GITHUB_OUTPUT"
          echo "sha=${OUT}.sha256" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          ARGS=(--target "${{ github.sha }}" --title "Semo Keyboard ${{ steps.ver.outputs.tag }}" --generate-notes)
          [ -n "${{ steps.ver.outputs.last }}" ] && ARGS+=(--notes-start-tag "${{ steps.ver.outputs.last }}")
          [ "$PRERELEASE" = "true" ] && ARGS+=(--prerelease)
          gh release create "${{ steps.ver.outputs.tag }}" "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.sha }}" "${ARGS[@]}"

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | while read -r T; do
            [ -n "$T" ] && gh release delete "$T" --yes --cleanup-tag || true
          done

name: Release

# ينشئ Release على GitHub تلقائيًا مع الـ APK، والتاج يُنشأ تلقائيًا من versionName بـ app/build.gradle.kts
# (مثل v3.2.0). لو التاج موجود مسبقًا يُضاف رقم التشغيل (v3.2.0-12) فلا يفشل ولا يُكتب فوق إصدار قديم.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "versionName not found in app/build.gradle.kts" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG="v${VERSION}-${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          if [ -z "$APK" ]; then
            echo "No release APK found" >&2
            exit 1
          fi
          OUT="SemoKeyboard-${{ steps.ver.outputs.tag }}.apk"
          cp "$APK" "$OUT"
          echo "file=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" "${{ steps.apk.outputs.file }}" \
            --target "${{ github.sha }}" \
            --title "Semo Keyboard ${{ steps.ver.outputs.tag }}" \
            --generate-notes

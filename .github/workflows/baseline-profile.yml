name: Baseline profile

on:
  workflow_dispatch:
    inputs:
      open_pr:
        description: 'Open a pull request with the generated profile'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: baseline-profile
  cancel-in-progress: false

jobs:
  generate:
    name: Generate on a managed emulator
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare benchmark module
        run: python3 tools/baseline/prepare.py

      - name: Generate baseline profile
        run: |
          gradle :app:generateReleaseBaselineProfile \
            -PincludeX86=true \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.androidTest.numManagedDeviceShards=1 \
            --no-daemon --stacktrace

      - name: Merge with existing rules
        run: python3 tools/baseline/merge_profile.py "$RUNNER_TEMP/profile/baseline-prof.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: ${{ runner.temp }}/profile/baseline-prof.txt
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: baseline-profile-reports
          path: |
            baselineprofile/build/reports
            baselineprofile/build/outputs
          if-no-files-found: ignore
          retention-days: 7

      - name: Restore build files
        if: inputs.open_pr
        run: |
          git checkout -- settings.gradle.kts build.gradle.kts app/build.gradle.kts
          rm -rf baselineprofile
          cp "$RUNNER_TEMP/profile/baseline-prof.txt" app/src/main/baseline-prof.txt

      - name: Open pull request
        if: inputs.open_pr
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: auto/baseline-profile
          delete-branch: true
          add-paths: app/src/main/baseline-prof.txt
          commit-message: 'Baseline profile: regenerate from a keyboard typing session'
          title: 'Baseline profile: regenerate'
          body: |
            Generated by the Baseline profile workflow on a Gradle managed Pixel 6 (API 34) emulator.

            - The session enables the keyboard, focuses a text field and taps a grid of key positions, swipes and long presses.
            - Existing hand-written rules are kept; generated rules are added on top and duplicates removed.
            - The emulator layout is x86_64 and the keyboard was driven by screen coordinates, so some panels may be missed. Compare the rule count in the run summary with the previous file.
            - This PR was created with GITHUB_TOKEN, so the Build workflow does not start by itself: close and reopen it, or run Build manually.

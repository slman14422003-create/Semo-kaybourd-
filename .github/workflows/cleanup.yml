name: Cleanup

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "${{ github.repository }}" --limit 300 --json databaseId,createdAt \
            --jq '.[] | select(.createdAt < (now - 14*86400 | todate)) | .databaseId' |
          while read -r ID; do
            [ -n "$ID" ] && gh run delete "$ID" --repo "${{ github.repository }}" || true
          done

name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Semo Keyboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # نسخة release المحسّنة (R8 + بروفايل Compose الجاهز): هذه التي يجب تثبيتها للاستعمال اليومي.
      # نسخة debug أبطأ بكثير مع Compose (تقطيع بالتمرير والكتابة) لأنها بلا تحسين.
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SemoKeyboard-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build debug APK (للتجارب فقط)
        if: always()
        run: gradle assembleDebug --no-daemon --stacktrace
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SemoKeyboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Lint
        if: always()
        run: gradle lintDebug --no-daemon
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

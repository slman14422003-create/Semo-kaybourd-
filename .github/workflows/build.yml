name: Build

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "**.md", ".github/ISSUE_TEMPLATE/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        continue-on-error: true

      - name: Lint
        run: gradle lintDebug --no-daemon
        continue-on-error: true

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: APK size
        id: size
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          BYTES=$(stat -c %s "$APK")
          MB=$(awk "BEGIN { printf \"%.2f\", $BYTES/1048576 }")
          echo "mb=${MB}" >> "$GITHUB_OUTPUT"
          echo "### Release APK: ${MB} MB" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: SemoKeyboard-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: SemoKeyboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Comment APK size on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "Release APK size - ${{ steps.size.outputs.mb }} MB"

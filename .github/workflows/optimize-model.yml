name: Optimize model

on:
  workflow_dispatch:
    inputs:
      open_pr:
        description: 'Open a pull request with the best passing variant'
        type: boolean
        required: false
        default: false
      min_top1:
        description: 'Minimum top-1 agreement with the float model'
        required: false
        default: '0.90'
      min_top5:
        description: 'Minimum top-5 overlap with the float model'
        required: false
        default: '0.85'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: optimize-model
  cancel-in-progress: false

jobs:
  optimize:
    name: Quantize and test batching
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: pip install onnx onnxruntime numpy tokenizers

      - name: Build and evaluate variants
        run: |
          set -euo pipefail
          python3 tools/optimize_ruq.py \
            --model app/src/main/assets/ai/ruq-5m.onnx \
            --tokenizer app/src/main/assets/ai/tokenizer.json \
            --corpus app/src/main/assets/corpus/ar.txt \
            --out "$RUNNER_TEMP/model_out" \
            --min-top1 "${{ inputs.min_top1 || '0.90' }}" \
            --min-top5 "${{ inputs.min_top5 || '0.85' }}"
          echo "BEST=$(cat "$RUNNER_TEMP/model_out/best.txt")" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/model_out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: model-variants
          path: |
            ${{ env.OUT }}/*.onnx
            ${{ env.OUT }}/report.json
            ${{ env.OUT }}/summary.md
          if-no-files-found: warn
          retention-days: 14

      - name: Apply best variant
        if: inputs.open_pr && env.BEST != 'none'
        run: cp "$OUT/ruq-5m-$BEST.onnx" app/src/main/assets/ai/ruq-5m.onnx

      - name: Open pull request
        if: inputs.open_pr && env.BEST != 'none'
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: auto/model-${{ env.BEST }}
          delete-branch: true
          add-paths: app/src/main/assets/ai/ruq-5m.onnx
          commit-message: 'Model: replace ruq-5m.onnx with the ${{ env.BEST }} variant'
          title: 'Model: ${{ env.BEST }} variant of ruq-5m'
          body: |
            Generated by the Optimize model workflow, variant **${{ env.BEST }}**.

            - The metrics table is in the workflow run summary and in the model-variants artifact.
            - The app copies the model to internal storage again when the asset size changes, so installs pick up the new file.
            - The batched beam path in NeuralLm turns on by itself when the input batch axis is dynamic.
            - Check the Full check page on a phone (model latency and suggestions) before merging.
            - This PR was created with GITHUB_TOKEN, so the Build workflow does not start by itself: close and reopen it, or run Build manually.
